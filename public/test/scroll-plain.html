<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scroll test – no fixed header</title>
<style>
  body { margin: 0; font: 18px/1.5 -apple-system, system-ui, sans-serif; background: #4c0296; color: #fff; }
  header { position: static; height: 76px; background: #fff; color: #4c0296; display: flex; align-items: center; padding: 0 16px; font-weight: 800; font-size: 22px; border-bottom: 1px solid #e6daf6; z-index: 10; }
  .spacer { height: 77px; }
  main { padding: 24px 16px; }
  .block { background: rgba(255,255,255,.1); border-radius: 16px; padding: 16px; margin: 16px 0; height: 180px; }
  #info { position: fixed; left: 8px; right: 8px; bottom: 90px; background: rgba(0,0,0,.85); font: 12px/1.4 ui-monospace, monospace; padding: 8px; border-radius: 10px; }
</style>
</head>
<body>
<header>TEST PAGE · normal header</header>

<main>
  <h1 style="margin:0 0 8px">TOP OF PAGE – this line should always be reachable</h1>
  <p>Plain HTML. No website code, fonts, animations or scripts except the number box below.</p>
  <div class="block">1</div><div class="block">2</div><div class="block">3</div><div class="block">4</div><div class="block">5</div>
  <div class="block">6</div><div class="block">7</div><div class="block">8</div><div class="block">9</div><div class="block">10</div>
  <div class="block">11</div><div class="block">12</div><div class="block">13</div><div class="block">14</div><div class="block">15</div>
</main>
<div id="info"></div>
<script>
  const el = document.getElementById('info');
  const show = () => { el.textContent = 'scrollY ' + Math.round(scrollY) + ' · innerHeight ' + innerHeight + ' · ' + (navigator.userAgent.match(/CriOS\/[\d.]+|Version\/[\d.]+/)||[''])[0]; };
  addEventListener('scroll', show, { passive: true }); addEventListener('resize', show); setInterval(show, 500); show();
</script>
</body>
</html>
